name: Diagnóstico temporário - schema Shopee

on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consultar schema
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEEID || secrets.SHOPEE_APP_ID || vars.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEESENHA || secrets.SHOPEE_SENHA || secrets.SHOPEESECRET || secrets.SHOPEE_SECRET || secrets.SENHA || secrets.SECRET || vars.SHOPEE_SECRET }}
        run: node scripts/_introspeccao_shopee.mjs
