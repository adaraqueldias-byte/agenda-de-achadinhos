name: Ofertas do dia da Shopee

on:
  schedule:
    - cron: "0 9 * * *" # 6h da manhã em Brasília (9h UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar ofertas na Shopee
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEEID || secrets.SHOPEE_APP_ID || vars.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEESENHA || secrets.SHOPEE_SENHA || secrets.SHOPEESECRET || secrets.SHOPEE_SECRET || secrets.SENHA || secrets.SECRET || vars.SHOPEE_SECRET }}
        run: node scripts/buscar-ofertas-shopee.mjs
      - name: Salvar no Painel
        run: |
          git config user.name "ofertas-shopee"
          git config user.email "actions@users.noreply.github.com"
          git add ofertas-shopee.json
          git diff --cached --quiet || (git commit -m "Atualiza ofertas do dia da Shopee" && git push)
