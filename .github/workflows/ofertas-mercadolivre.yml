name: Ofertas do dia do Mercado Livre

on:
  schedule:
    - cron: "22 9 * * *" # ~6h20 da manhã em Brasília (9h22 UTC) — logo depois da Shopee, fora do minuto redondo
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar ofertas no Mercado Livre
        run: node scripts/buscar-ofertas-mercadolivre.mjs
      - name: Salvar no Painel
        run: |
          git config user.name "ofertas-mercadolivre"
          git config user.email "actions@users.noreply.github.com"
          git add ofertas-mercadolivre.json
          if git diff --cached --quiet; then
            echo "Sem mudanças pra salvar."
          else
            git commit -m "Atualiza ofertas do dia do Mercado Livre"
            git pull --rebase origin main
            git push
          fi
