<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banners do Garimpo do Dia</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#fff7ea;color:#7a3a45;padding:16px;text-align:center}
h1{font-size:22px;margin:8px 0 4px}
p.dica{font-size:15px;margin:0 0 18px}
.banner{background:#fff;border-radius:18px;padding:14px;margin:0 auto 22px;max-width:480px;box-shadow:0 6px 20px rgba(122,58,69,.1)}
.banner h2{font-size:18px;margin:4px 0 10px}
.banner img{width:100%;border-radius:10px;display:block}
button{margin-top:12px;width:100%;border:0;border-radius:999px;padding:16px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(90deg,#fd6215,#f0533a)}
</style></head><body>
<h1>Banners do Garimpo do Dia</h1>
<p class="dica">Toque em <b>Salvar na galeria</b>. Se não der, segure o dedo na imagem e escolha <b>Salvar imagem</b>.</p>

<div class="banner"><h2>📱 Status e Story</h2>
<img src="banners/banner-story-garimpo-do-dia.png" alt="Banner para status e story">
<button onclick="salvar('banners/banner-story-garimpo-do-dia.png','garimpo-do-dia-story.png')">⬇️ Salvar na galeria</button></div>

<div class="banner"><h2>🟦 Facebook (quadrado)</h2>
<img src="banners/banner-facebook-1x1-garimpo-do-dia.png" alt="Banner quadrado para Facebook">
<button onclick="salvar('banners/banner-facebook-1x1-garimpo-do-dia.png','garimpo-do-dia-facebook.png')">⬇️ Salvar na galeria</button></div>

<script>
async function salvar(url,nome){
  try{
    const blob=await (await fetch(url)).blob();
    const arquivo=new File([blob],nome,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[arquivo]})){
      await navigator.share({files:[arquivo]});return;
    }
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();
    alert("Pronto! A imagem foi baixada. Ela aparece na Galeria, na pasta Downloads.");
  }catch(e){if(!e||e.name!=="AbortError")alert("Segure o dedo na imagem e escolha Salvar imagem.")}
}
</script>
</body></html>
